<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow | Dashboard To-Do Application & Reminders</title>
  <meta name="description" content="A clean, modern, dark glassmorphism dashboard To-Do List web application with real-time customizable reminders, statistics, and local storage.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Application Header -->
    <header class="app-header">
      <div class="brand-wrapper">
        <div class="logo-badge">
          <!-- Checkmark Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 11 12 14 22 4"></polyline>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
        </div>
        <div class="app-title-group">
          <h1>TaskFlow</h1>
          <p class="app-subtitle">Manage goals & real-time reminders</p>
        </div>
      </div>
      <div class="header-right">
        <div class="date-badge">
          <span class="current-day" id="currentDay">Today</span>
          <span id="currentDate">Date</span>
        </div>
        <!-- Notification Permission Status Badge -->
        <button id="notifyPermissionBtn" class="notify-perm-btn" title="Enable browser notifications">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span id="notifyPermText">Enable Alerts</span>
        </button>
      </div>
    </header>

    <!-- Dashboard Statistics -->
    <section class="stats-grid" aria-label="Task Statistics">
      <div class="stat-card">
        <div class="stat-icon total">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
        </div>
        <div class="stat-info">
          <div class="stat-value" id="statTotal">0</div>
          <div class="stat-label">Total Tasks</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon active">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </div>
        <div class="stat-info">
          <div class="stat-value" id="statActive">0</div>
          <div class="stat-label">Active</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon completed">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
        <div class="stat-info">
          <div class="stat-value" id="statCompleted">0</div>
          <div class="stat-label">Completed</div>
        </div>
      </div>
    </section>

    <!-- Overall Progress Bar Card -->
    <div class="progress-card">
      <div class="progress-header">
        <span>Completion Rate</span>
        <span class="progress-percent" id="progressPercent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- Task Creation Input Form with Real-time Reminder Options -->
    <section class="task-input-card">
      <form id="taskForm" class="input-form">
        <div class="form-row-main">
          <div class="input-field-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="16"></line>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
            <input type="text" id="taskInput" class="task-input" placeholder="What needs to be done today?" autocomplete="off">
          </div>

          <select id="prioritySelect" class="priority-select" aria-label="Task Priority">
            <option value="low">Low Priority</option>
            <option value="medium" selected>Medium Priority</option>
            <option value="high">High Priority</option>
          </select>

          <button type="submit" id="addTaskBtn" class="btn-add">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Add Task
          </button>
        </div>

        <!-- Customizable Reminder Controls Row -->
        <div class="form-row-reminder">
          <label class="reminder-toggle-label">
            <input type="checkbox" id="enableReminderCheck">
            <span class="reminder-toggle-custom">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              </svg>
              Set Real-time Reminder
            </span>
          </label>

          <div id="reminderInputGroup" class="reminder-input-group hidden">
            <input type="datetime-local" id="reminderDateTime" class="datetime-input">
            <label class="sound-toggle-label" title="Play chime sound when reminder triggers">
              <input type="checkbox" id="reminderSoundCheck" checked>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              </svg>
              Sound Alert
            </label>
          </div>
        </div>
      </form>
    </section>

    <!-- Active Reminders Dashboard Section -->
    <section id="remindersSection" class="reminders-section hidden">
      <div class="reminders-header">
        <div class="reminders-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          Upcoming Reminders
        </div>
        <span class="reminders-count-badge" id="remindersCountBadge">0</span>
      </div>
      <div id="remindersList" class="reminders-list">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- Task List Controls & Filters -->
    <section class="controls-bar">
      <!-- Filter Tabs -->
      <div class="filters-group" role="tablist">
        <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
        <button class="filter-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
        <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
      </div>

      <!-- Realtime Search Box -->
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search tasks...">
      </div>

      <!-- Clear Completed Button -->
      <button id="clearCompletedBtn" class="btn-clear" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        Clear Completed
      </button>
    </section>

    <!-- Dynamic Tasks Container -->
    <main>
      <div id="tasksContainer" class="tasks-container">
        <!-- Tasks will be rendered dynamically by JavaScript -->
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <span>TaskFlow &copy; 2026</span> &bull; <span>Built with HTML, CSS & Vanilla JS</span>
    </footer>

  </div>

  <!-- Real-Time Reminder Alert Modal Popover -->
  <div id="reminderModalOverlay" class="modal-overlay hidden">
    <div class="reminder-modal-card">
      <div class="reminder-modal-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </div>
      <div class="reminder-modal-header">
        <span class="reminder-tag">REMINDER ALERT</span>
        <h3 id="modalTaskTitle" class="modal-task-title">Task Title</h3>
        <p id="modalTaskTime" class="modal-task-time">Scheduled for 12:00 PM</p>
      </div>
      <div class="modal-actions">
        <button id="modalSnooze5Btn" class="btn-snooze">Snooze 5m</button>
        <button id="modalSnooze15Btn" class="btn-snooze">Snooze 15m</button>
        <button id="modalCompleteBtn" class="btn-complete-modal">Mark Done</button>
        <button id="modalDismissBtn" class="btn-dismiss-modal">Dismiss</button>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
